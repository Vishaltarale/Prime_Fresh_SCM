<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Registration | Prime Fresh SCM</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes floatOrb {
      0%,100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-18px) scale(1.04); }
    }
    .card     { animation: fadeInUp 0.55s cubic-bezier(0.16,1,0.3,1) both; }
    .orb1     { animation: floatOrb 7s ease-in-out infinite; }
    .orb2     { animation: floatOrb 9s ease-in-out infinite reverse; }

    /* Floating label */
    .fl-wrap  { position: relative; }
    .fl-input {
      width: 100%; padding: 22px 16px 8px;
      border: 1.5px solid #e2e8f0; border-radius: 12px;
      font-size: 14px; color: #1e293b;
      background: #f8faff;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      outline: none;
    }
    .fl-input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124,58,237,0.14);
      background: #fff;
    }
    .fl-label {
      position: absolute; left: 16px; top: 50%;
      transform: translateY(-50%);
      font-size: 14px; color: #94a3b8;
      pointer-events: none;
      transition: all 0.2s ease;
    }
    .fl-input:focus ~ .fl-label,
    .fl-input:not(:placeholder-shown) ~ .fl-label {
      top: 10px; transform: translateY(0);
      font-size: 10px; font-weight: 600;
      color: #7c3aed; letter-spacing: 0.04em; text-transform: uppercase;
    }

    /* Select */
    .fl-select {
      width: 100%; padding: 14px 16px;
      border: 1.5px solid #e2e8f0; border-radius: 12px;
      font-size: 14px; color: #1e293b;
      background: #f8faff;
      appearance: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      cursor: pointer;
    }
    .fl-select:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124,58,237,0.14);
      background: #fff;
    }

    /* Password toggle */
    .pw-wrap { position: relative; }
    .pw-toggle {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%);
      cursor: pointer; color: #94a3b8;
      transition: color 0.2s; font-size: 14px;
      background: none; border: none; padding: 0;
    }
    .pw-toggle:hover { color: #7c3aed; }

    /* Strength bar */
    .strength-bar {
      height: 4px; border-radius: 99px;
      transition: width 0.4s ease, background 0.4s ease;
    }

    /* Submit button */
    .btn-submit {
      background: linear-gradient(135deg,#7c3aed,#4f46e5);
      transition: all 0.22s ease;
      box-shadow: 0 6px 22px rgba(124,58,237,0.38);
    }
    .btn-submit:hover {
      background: linear-gradient(135deg,#6d28d9,#4338ca);
      box-shadow: 0 10px 30px rgba(124,58,237,0.48);
      transform: translateY(-2px);
    }
    .btn-submit:active { transform: translateY(0); }

    /* Role badge icons */
    .role-card input[type=radio]:checked + label {
      border-color: #7c3aed;
      background: rgba(124,58,237,0.07);
      color: #7c3aed;
    }
    .role-card input[type=radio]:checked + label .role-dot {
      background: #7c3aed;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 overflow-x-hidden"
      style="background:linear-gradient(135deg,#0f0c29 0%,#1a1045 40%,#1e1b4b 70%,#0d1b3e 100%)">

  <!-- Background orbs -->
  <div class="orb1 fixed top-[-120px] left-[-100px] w-[420px] h-[420px] rounded-full pointer-events-none"
       style="background:radial-gradient(circle,rgba(124,58,237,0.22),transparent 70%)"></div>
  <div class="orb2 fixed bottom-[-100px] right-[-80px] w-[360px] h-[360px] rounded-full pointer-events-none"
       style="background:radial-gradient(circle,rgba(6,182,212,0.16),transparent 70%)"></div>
  <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] rounded-full pointer-events-none"
       style="background:radial-gradient(circle,rgba(79,70,229,0.08),transparent 65%)"></div>

  <!-- Card -->
  <div class="card relative w-full max-w-md">

    <!-- Glass card -->
    <div class="relative rounded-3xl overflow-hidden shadow-2xl border border-white/10"
         style="background:rgba(255,255,255,0.97);backdrop-filter:blur(20px)">

      <!-- Top gradient bar -->
      <div class="h-1.5 w-full" style="background:linear-gradient(90deg,#7c3aed,#4f46e5,#06b6d4)"></div>

      <div class="p-8">

        <!-- Logo + heading -->
        <div class="text-center mb-7">
          <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-4 shadow-lg"
               style="background:linear-gradient(135deg,#7c3aed,#4f46e5)">
            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 3C10 7 4 8 4 13a8 8 0 0016 0c0-5-6-6-8-10z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 13v5"/>
            </svg>
          </div>
          <h2 class="text-2xl font-bold text-slate-800 font-display">Create Account</h2>
          <p class="text-slate-500 text-sm mt-1">Join the Prime Fresh SCM platform</p>
        </div>

        <!-- Error alert -->
        {% if error %}
        <div class="flex items-center gap-3 mb-5 px-4 py-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm font-medium">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
          </svg>
          {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'Users:user_register' %}" class="space-y-4" id="regForm">
          {% csrf_token %}

          <!-- Full Name -->
          <div class="fl-wrap">
            <input type="text" name="full_name" id="full_name" required
                   class="fl-input" placeholder=" " autocomplete="name"/>
            <label for="full_name" class="fl-label">Full Name</label>
          </div>

          <!-- Email -->
          <div class="fl-wrap">
            <input type="email" name="email" id="email" required
                   class="fl-input" placeholder=" " autocomplete="email"/>
            <label for="email" class="fl-label">Email Address</label>
          </div>

          <!-- Phone -->
          <div class="fl-wrap">
            <input type="tel" name="phone" id="phone" required
                   class="fl-input" placeholder=" " autocomplete="tel"/>
            <label for="phone" class="fl-label">Phone Number</label>
          </div>

          <!-- Role -->
          <div>
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2 px-1">Select Role</p>
            <div class="grid grid-cols-3 gap-2">

              <div class="role-card">
                <input type="radio" name="role" id="role_admin" value="Admin" class="sr-only" required>
                <label for="role_admin"
                       class="flex flex-col items-center gap-1.5 p-3 rounded-xl border-2 border-slate-200 cursor-pointer text-center transition-all hover:border-violet-300 hover:bg-violet-50/50">
                  <span class="role-dot w-2 h-2 rounded-full bg-slate-300 transition-colors"></span>
                  <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                  </svg>
                  <span class="text-xs font-semibold text-slate-600">Admin</span>
                </label>
              </div>

              <div class="role-card">
                <input type="radio" name="role" id="role_inventory" value="Inventory Officer" class="sr-only">
                <label for="role_inventory"
                       class="flex flex-col items-center gap-1.5 p-3 rounded-xl border-2 border-slate-200 cursor-pointer text-center transition-all hover:border-violet-300 hover:bg-violet-50/50">
                  <span class="role-dot w-2 h-2 rounded-full bg-slate-300 transition-colors"></span>
                  <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                  </svg>
                  <span class="text-xs font-semibold text-slate-600">Inventory</span>
                </label>
              </div>

              <div class="role-card">
                <input type="radio" name="role" id="role_warehouse" value="Warehouse Manager" class="sr-only">
                <label for="role_warehouse"
                       class="flex flex-col items-center gap-1.5 p-3 rounded-xl border-2 border-slate-200 cursor-pointer text-center transition-all hover:border-violet-300 hover:bg-violet-50/50">
                  <span class="role-dot w-2 h-2 rounded-full bg-slate-300 transition-colors"></span>
                  <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                  </svg>
                  <span class="text-xs font-semibold text-slate-600">Warehouse</span>
                </label>
              </div>

            </div>
          </div>

          <!-- Password -->
          <div class="fl-wrap pw-wrap">
            <input type="password" name="password1" id="password1" required
                   class="fl-input pr-10" placeholder=" " autocomplete="new-password"
                   oninput="checkStrength(this.value)"/>
            <label for="password1" class="fl-label">Password</label>
            <button type="button" class="pw-toggle" onclick="togglePw('password1',this)">
              <svg id="eye1" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
          <!-- Strength indicator -->
          <div class="px-1 -mt-2">
            <div class="w-full h-1 bg-slate-100 rounded-full overflow-hidden">
              <div id="strength-bar" class="strength-bar h-full" style="width:0%;background:#e2e8f0"></div>
            </div>
            <p id="strength-text" class="text-[10px] text-slate-400 mt-1"></p>
          </div>

          <!-- Confirm Password -->
          <div class="fl-wrap pw-wrap">
            <input type="password" name="password2" id="password2" required
                   class="fl-input pr-10" placeholder=" " autocomplete="new-password"/>
            <label for="password2" class="fl-label">Confirm Password</label>
            <button type="button" class="pw-toggle" onclick="togglePw('password2',this)">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
          <p id="pw-match" class="text-[11px] px-1 -mt-2 hidden"></p>

          <!-- Submit -->
          <button type="submit"
                  class="btn-submit w-full py-3 rounded-xl text-white font-semibold text-sm mt-2">
            Create Account
          </button>

        </form>

        <p class="mt-5 text-center text-sm text-slate-500">
          Already have an account?
          <a href="{% url 'Users:login_user' %}" class="font-semibold hover:underline" style="color:#7c3aed">Sign In</a>
        </p>

      </div>
    </div>

    <!-- Bottom brand note -->
    <p class="text-center text-xs text-white/30 mt-4">Prime Fresh SCM &copy; 2026</p>
  </div>

  <script>
    function togglePw(id, btn) {
      const inp = document.getElementById(id);
      const isText = inp.type === 'text';
      inp.type = isText ? 'password' : 'text';
      btn.style.color = isText ? '' : '#7c3aed';
    }

    function checkStrength(val) {
      const bar  = document.getElementById('strength-bar');
      const text = document.getElementById('strength-text');
      let score = 0;
      if (val.length >= 8)         score++;
      if (/[A-Z]/.test(val))       score++;
      if (/[0-9]/.test(val))       score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      const levels = [
        { w:'0%',   c:'#e2e8f0', t:'' },
        { w:'25%',  c:'#ef4444', t:'Weak' },
        { w:'50%',  c:'#f59e0b', t:'Fair' },
        { w:'75%',  c:'#3b82f6', t:'Good' },
        { w:'100%', c:'#10b981', t:'Strong' },
      ];
      const l = levels[score] || levels[0];
      bar.style.width = l.w; bar.style.background = l.c;
      text.textContent = l.t; text.style.color = l.c;
    }

    // Password match check
    document.getElementById('password2').addEventListener('input', function() {
      const p1 = document.getElementById('password1').value;
      const el = document.getElementById('pw-match');
      el.classList.remove('hidden');
      if (this.value === p1) {
        el.textContent = '✓ Passwords match'; el.style.color = '#10b981';
      } else {
        el.textContent = '✗ Passwords do not match'; el.style.color = '#ef4444';
      }
    });
  </script>

</body>
</html>
