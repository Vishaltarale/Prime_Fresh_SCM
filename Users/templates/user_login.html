<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In | Prime Fresh SCM</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }

    @keyframes fadeInUp {
      from { opacity:0; transform:translateY(28px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes floatOrb {
      0%,100% { transform:translateY(0) scale(1); }
      50%     { transform:translateY(-20px) scale(1.05); }
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .card  { animation: fadeInUp 0.55s cubic-bezier(0.16,1,0.3,1) both; }
    .orb1  { animation: floatOrb 7s ease-in-out infinite; }
    .orb2  { animation: floatOrb 9s ease-in-out infinite reverse; }
    .ring  { animation: spinSlow 18s linear infinite; }

    .fl-wrap { position: relative; }
    .fl-input {
      width:100%; padding:22px 16px 8px;
      border:1.5px solid #e2e8f0; border-radius:12px;
      font-size:14px; color:#1e293b; background:#f8faff;
      transition:border-color .2s, box-shadow .2s, background .2s;
      outline:none;
    }
    .fl-input:focus {
      border-color:#7c3aed;
      box-shadow:0 0 0 3px rgba(124,58,237,.14);
      background:#fff;
    }
    .fl-label {
      position:absolute; left:16px; top:50%;
      transform:translateY(-50%);
      font-size:14px; color:#94a3b8;
      pointer-events:none;
      transition:all .2s ease;
    }
    .fl-input:focus ~ .fl-label,
    .fl-input:not(:placeholder-shown) ~ .fl-label {
      top:10px; transform:translateY(0);
      font-size:10px; font-weight:600;
      color:#7c3aed; letter-spacing:.04em; text-transform:uppercase;
    }
    .pw-toggle {
      position:absolute; right:14px; top:50%; transform:translateY(-50%);
      cursor:pointer; color:#94a3b8; transition:color .2s;
      background:none; border:none; padding:0;
    }
    .pw-toggle:hover { color:#7c3aed; }

    .btn-submit {
      background:linear-gradient(135deg,#7c3aed,#4f46e5);
      transition:all .22s ease;
      box-shadow:0 6px 22px rgba(124,58,237,.38);
    }
    .btn-submit:hover {
      background:linear-gradient(135deg,#6d28d9,#4338ca);
      box-shadow:0 10px 30px rgba(124,58,237,.48);
      transform:translateY(-2px);
    }
    .btn-submit:active { transform:translateY(0); }

    .error-shake {
      animation: shake .4s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%,90%  { transform:translateX(-2px); }
      20%,80%  { transform:translateX(4px);  }
      30%,50%,70% { transform:translateX(-6px); }
      40%,60%  { transform:translateX(6px);  }
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4"
      style="background:linear-gradient(135deg,#0f0c29 0%,#1a1045 40%,#1e1b4b 70%,#0d1b3e 100%)">

  <!-- Background orbs -->
  <div class="orb1 fixed top-[-100px] left-[-80px] w-[380px] h-[380px] rounded-full pointer-events-none"
       style="background:radial-gradient(circle,rgba(124,58,237,.22),transparent 70%)"></div>
  <div class="orb2 fixed bottom-[-80px] right-[-60px] w-[320px] h-[320px] rounded-full pointer-events-none"
       style="background:radial-gradient(circle,rgba(6,182,212,.16),transparent 70%)"></div>

  <!-- Decorative spinning ring -->
  <div class="ring fixed top-[-60px] right-[10%] w-[280px] h-[280px] rounded-full pointer-events-none opacity-10"
       style="border:1.5px solid rgba(167,139,250,.5)"></div>

  <div class="card relative w-full max-w-sm">
    <div class="relative rounded-3xl overflow-hidden shadow-2xl border border-white/10"
         style="background:rgba(255,255,255,.97);backdrop-filter:blur(20px)">

      <!-- Top gradient bar -->
      <div class="h-1.5 w-full" style="background:linear-gradient(90deg,#7c3aed,#4f46e5,#06b6d4)"></div>

      <div class="p-8">

        <!-- Logo + heading -->
        <div class="text-center mb-7">
          <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-4 shadow-lg"
               style="background:linear-gradient(135deg,#7c3aed,#4f46e5)">
            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 3C10 7 4 8 4 13a8 8 0 0016 0c0-5-6-6-8-10z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 13v5"/>
            </svg>
          </div>
          <h2 class="text-2xl font-bold text-slate-800" style="font-family:'Plus Jakarta Sans',sans-serif">Welcome Back</h2>
          <p class="text-slate-500 text-sm mt-1">Sign in to your SCM dashboard</p>
        </div>

        <!-- Error alert -->
        {% if error %}
        <div class="error-shake flex items-center gap-3 mb-5 px-4 py-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm font-medium">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'Users:login_user_save' %}" class="space-y-4">
          {% csrf_token %}

          <!-- Email -->
          <div class="fl-wrap">
            <input type="email" name="email" id="email" required
                   class="fl-input" placeholder=" " autocomplete="email"/>
            <label for="email" class="fl-label">Email Address</label>
          </div>

          <!-- Password -->
          <div class="fl-wrap" style="position:relative">
            <input type="password" name="password" id="password" required
                   class="fl-input pr-10" placeholder=" " autocomplete="current-password"/>
            <label for="password" class="fl-label">Password</label>
            <button type="button" class="pw-toggle" onclick="togglePw()">
              <svg id="eye-icon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>

          <button type="submit" class="btn-submit w-full py-3 rounded-xl text-white font-semibold text-sm mt-1">
            Sign In
          </button>
        </form>

        <!-- Divider -->
        <div class="flex items-center gap-3 my-5">
          <div class="flex-1 h-px bg-slate-100"></div>
          <span class="text-xs text-slate-400 font-medium">New to Prime Fresh?</span>
          <div class="flex-1 h-px bg-slate-100"></div>
        </div>

        <a href="{% url 'mysite:user_reg' %}"
           class="flex items-center justify-center gap-2 w-full py-2.5 rounded-xl border-2 border-violet-200 text-violet-700 font-semibold text-sm hover:bg-violet-50 transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
          </svg>
          Create an Account
        </a>

      </div>
    </div>
    <p class="text-center text-xs text-white/30 mt-4">Prime Fresh SCM &copy; 2026</p>
  </div>

  <script>
    function togglePw() {
      const inp = document.getElementById('password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
